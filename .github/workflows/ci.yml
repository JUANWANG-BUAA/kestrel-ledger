name: CI

on:
  push:
  pull_request:

# The repository needs JDK 21 and Android SDK 35; the same commands are documented in AGENTS.md.
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Domain and Android unit tests
        run: ./gradlew :domain:test :data:testDebugUnitTest :app:testDebugUnitTest --console=plain
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --console=plain
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            */build/reports/tests/**
            */build/test-results/**
          if-no-files-found: ignore

  data-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Byte-compile data collection tools
        run: python3 -m compileall -q tools
